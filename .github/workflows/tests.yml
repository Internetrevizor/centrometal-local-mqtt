name: Tests
on:
  push:
  pull_request:
  # Called by release.yml, which publishes a release only after these pass.
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -B -m unittest discover -s tests -v

  real-home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - run: python -m pytest tests/ha -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  image-starts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp custom_components/centrometal_local/parameters.py centrometal_local_mqtt/
      - run: docker build -t app centrometal_local_mqtt
      - name: The app starts and answers under its real AppArmor profile
        run: |
          sudo apparmor_parser -r -W centrometal_local_mqtt/apparmor.txt
          mkdir -p /tmp/app/data /tmp/app/share
          echo '{"module_ip": "192.0.2.1"}' > /tmp/app/data/options.json
          docker run -d --name app --security-opt apparmor=centrometal_local_mqtt \
            -v /tmp/app/data:/data -v /tmp/app/share:/share app
          sleep 5
          docker logs app
          test "$(docker inspect -f '{{.State.Running}}' app)" = true
          test "$(docker inspect -f '{{.AppArmorProfile}}' app)" = centrometal_local_mqtt
          curl -sf "http://$(docker inspect -f '{{.NetworkSettings.IPAddress}}' app):8765/health"
          docker stop -t 5 app
          test "$(docker inspect -f '{{.State.ExitCode}}' app)" = 0
