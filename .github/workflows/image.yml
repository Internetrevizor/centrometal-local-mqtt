name: Image

# Publishes the image of the version in config.yaml. An existing tag is never replaced: a change needs a new version.
# The image has to exist before config.yaml reaches main, because the store offers the new version from there.
on:
  workflow_dispatch:
  push:
    branches: [main, "rework-*"]
    paths:
      - centrometal_local_mqtt/**
      - custom_components/**
      - .github/workflows/image.yml

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: centrometal-local-mqtt
  REGISTRY_PREFIX: ghcr.io/internetrevizor

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: |
          echo "version=$(sed -n 's/^version: //p' centrometal_local_mqtt/config.yaml)" >> "$GITHUB_OUTPUT"
      - id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - run: cp custom_components/centrometal_local/parameters.py centrometal_local_mqtt/
      - uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: centrometal_local_mqtt
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: "true"
          skip-existing: ${{ needs.init.outputs.version }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          skip-existing: ${{ needs.init.outputs.version }}
