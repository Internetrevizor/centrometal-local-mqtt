# Checked in CI (tests.yml). The app runs on the Python of its image, the integration on Home Assistant's.
target-version = "py313"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "W", "F", "B", "UP", "ASYNC"]

[lint.per-file-ignores]
# Tests import after a sys.path set-up, read small fixture files inside async tests, and evaluate expressions for
# their side effect.
"tests/*" = ["E402", "ASYNC109", "ASYNC230", "ASYNC240", "B018"]
