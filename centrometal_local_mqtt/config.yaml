name: Centrometal Local MQTT Protocol
version: 1.0.2
slug: centrometal_local_mqtt
description: Runs your PelTec II Lambda without the Centrometal cloud, or next to it. A small local server for the boiler's WiFi module, for readings and on/off, even with no internet.
url: https://github.com/Internetrevizor/centrometal-local-mqtt
startup: services
boot: auto
init: false
arch:
  - aarch64
  - amd64
  - armv7
host_network: true
map:
  - share:rw
  - homeassistant_config:rw
watchdog: tcp://[HOST]:[PORT:1883]
options:
  module_ip: ""
  connection_mode: local
  upstream_host: portal.centrometal.hr
  poll_interval_seconds: 240
  debug_journal: false
schema:
  module_ip: str
  connection_mode: list(local|cloud_proxy|cloud_proxy_fallback)
  upstream_host: str
  poll_interval_seconds: int(10,3600)
  debug_journal: bool
